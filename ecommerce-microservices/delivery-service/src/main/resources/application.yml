server:
  port: 8086

spring:
  application:
    name: DELIVERY-SERVICE
  datasource:
    url: jdbc:mysql://mysql:3306/delivery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ecommerce
    password: ecommerce123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
